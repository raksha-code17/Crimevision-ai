services:
  - type: web
    name: crimevision-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_ML_MODELS
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: VIDEO_MAX_SECONDS
        value: "60"
